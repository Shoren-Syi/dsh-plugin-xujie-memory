# 预筛词表（M4.1）
#
# 改这个文件不需要动代码：config.yaml 里 extract.lexicon_path 指向你自己的版本即可。
#
# 约定
#   1. 每个类别是一组正则，命中任一即算该类别命中
#   2. 一律用单引号包住，避免 \d 被 YAML 当转义序列吃掉
#   3. 禁止 .* 和 .+。需要跨度就写 [^。！？]{0,8} 这种带上限的写法——
#      中文正则的性能事故，九成来自不设上限的 .*
#   4. 匹配前文本会做 NFKC 归一化（全角数字/标点转半角），所以只用写半角
#
# 写宽写窄的取舍
#   写宽 → 每轮都送进抽取器，等于没做预筛，白烧钱
#   写窄 → 事实永远进不了库，而且不可挽回（用户不会重复说一遍）
#   所以这里只放"强信号"，靠 answer_to_question 兜住问答式信息获取。

version: 1

# 计划：到点要主动唤醒的。命中即放行，不受最短长度限制
# （"8点叫我"只有 4 个字，但它是整句话最值钱的部分）
plan:
  - '提醒我'
  - '别忘了'
  - '(明天|后天|大后天|今晚|今天|周[一二三四五六日天]|下周|下礼拜|下个月)[^。！？]{0,10}(点|点钟|号|日)[^。！？]{0,12}(叫|提醒|做|去|打|发|开|忘|交|买|订)'
  - '[0-9一二三四五六七八九十]{1,2}\s*点\s*(半|[0-9]{0,2})?[^。！？]{0,10}(叫|提醒)'
  - '(记得|要|得)[^。！？]{0,10}(提醒|叫我)'
  - '(到点|准时)[^。！？]{0,8}(提醒|叫)'
  - '(叫我|喊我)起床'

# 偏好：口味、习惯、好恶。角色卡里"他喜欢什么"几乎全从这里来
preference:
  - '我喜欢'
  - '我不喜欢'
  - '我爱(吃|喝|看|听|玩|上|去)'
  - '我最(喜欢|爱|讨厌|怕|烦)'
  - '我讨厌'
  - '我(受不了|烦死|腻了)'
  - '我习惯'
  - '我一般[^。！？]{0,12}(都|不|会|在|去|用|吃|喝|就|出|走)'
  - '我更(喜欢|愿意|倾向|偏好)'
  # 限定宾语：不限定的话"我吃不了这么多"会被当成饮食偏好
  - '我(不吃|不喝|忌口|戒了)'
  - '我戒(酒|烟|糖|咖啡|夜宵)'
  - '不(能|敢)吃[^。！？]{0,4}(辣|凉|冰|海鲜|油腻|甜|苦|腥|肉|奶|酒)'
  - '我(吃|喝)不了[^。！？]{0,4}(辣|凉|冰|海鲜|油腻|甜|苦|腥|肉|奶|酒|咖啡|香菜)'
  - '我对[^。！？]{1,12}(感兴趣|没兴趣|不感兴趣|无感)'
  - '我的?爱好'
  - '我(有点|很|特别|超)(怕|讨厌|喜欢|爱|烦)'
  - '我把[^。！？]{0,4}戒了'

# 时间锚：单独出现不算信号（"去年那部电影真好看"），只用来给 fact 加标注
time:
  - '去年|前年|今年|明年|上周|上个月|上礼拜|小时候|那会儿|那时候|当时|以前|从前|刚毕业|刚工作|几年前|多年前|前阵子'
  - '\d{4}\s*年'

# 事实：身份、居所、职业、家人、宠物、健康、技能
# 中文的"了"极易误判（"我吃了"不是事实陈述），一律不放进模式里
fact:
  # "我是外科医生""我是一名小学老师"：职业词前允许 6 个修饰字
  - '我是(一?[名个])?[^。！？]{0,6}(程序员|工程师|设计师|老师|医生|护士|学生|研究生|博士生|律师|会计|销售|运营|产品经理|创业者|自由职业|公务员|警察|司机|厨师|作家|记者|摄影师|音乐人|画师|店主|老板)'
  # "我是做前端的"：口语里"做 X"就是"职业是 X"
  - '我是(做|干)(前端|后端|开发|设计|运营|销售|财务|法务|人事|市场|产品|技术|工程|研究|教育|医疗|金融|建筑|外贸|采购|客服|美术|测试)'
  - '我(在|于)[^。！？]{1,12}(工作|上班|读书|上学|实习|兼职)'
  - '我(在|于)[^。！？]{1,12}(公司|厂|单位|机构|学校|医院|律所|银行|出版社|报社|杂志社|事务所|工作室|集团|平台|团队)[^。！？]{0,12}(做|干|负责|当|待|工作)'
  # 公司名不可枚举（"我在字节做后端"），所以退一步认「在做+职能词」
  - '我在[^。！？]{1,10}(做|干)(后端|前端|开发|运营|设计|销售|财务|法务|人事|市场|产品|技术|研究|测试|客服|采购)'
  - '我(租|买房|租房)(在|到)?[^。！？]{1,12}'
  # 家人提及：只要说了"我妈/我哥/我闺女"，基本都带着值得记的事
  - '我(爸|妈|父亲|母亲|哥|姐|弟|妹|爷爷|奶奶|姥姥|姥爷|舅舅|姑姑|叔叔|阿姨|表哥|表姐|堂哥|堂姐|闺女|儿子|女儿)'
  - '我(住|住在|定居|搬)(在|到|去|回)?[^。！？]{1,12}'
  - '我(老家|家乡|籍贯)'
  # "我家里养了只乌龟"：地点词夹在中间
  # 物种名不可枚举（边牧/雪纳瑞/中华田园…），认「养了一只/条」这个句式
  - '我[^。！？]{0,4}(养|喂)(了)?(一?[只个条匹头])[^。！？]{0,10}'
  - '我[^。！？]{0,4}(养|喂)(了)?[^。！？]{0,6}(猫|狗|仓鼠|兔子|鸟|鱼|乌龟|蛇|蜥蜴|鹦鹉)'
  # 数量词必须可选且不能写死"一个"——"我有两个儿子"是最常见说法
  - '我(有|没有)(一|两|二|三|四|五|几)?(个)?(孩子|女儿|儿子|老婆|老公|太太|先生|女朋友|男朋友|对象|弟弟|妹妹|哥哥|姐姐)'
  # 口语把"离婚"说成"离的婚""结的婚"，中间还夹时间
  - '我[^。！？]{0,6}(离的婚|结的婚|结过婚|离过婚)'
  - '我在读[^。！？]{1,14}'
  - '我今年[0-9一二三四五六七八九十]{1,3}(岁|了|[。！？.]|$)'
  # 搬家用"我刚搬到X"，"刚"挡在"我"和"搬"之间
  - '我[^。！？]{0,6}搬(到|去|回|走|来)?[^。！？]{0,12}'
  - '我(吃|喝)[^。！？]{0,8}(就|会)(拉肚子|难受|过敏|不舒服|起疹|吐|疼)'
  - '我(胃|腰|颈椎|心脏|血压|血糖|睡眠|眼睛|牙|头|膝盖|肝|肾|肠)[^。！？]{0,4}(不好|不行|有毛病|疼|弱)'
  - '我[^。！？]{0,4}(结婚|离婚|订婚|怀孕)'
  - '我(今年)?[0-9一二三四五六七八九十]{1,3}\s*岁'
  - '我(对|吃|碰)[^。！？]{0,8}(过敏|忌口)'
  - '我(会|能|擅长|学过|懂)(说|用|写|弹|拉|画|做|打|修|开|编|剪|烧|拍|下|种|养)[^。！？]{0,10}'
  - '我(的)?(生日|职业|工作|专业|学校|公司|名字|年龄|血型|身高)'
  - '我(正在|在)做[^。！？]{1,15}'
  # 习惯：必须带一个行为动词，否则"我每天都好累"会被误放
  # 这条从「时段 + 动词白名单」退化成「时段 + 任意」。
  # 代价是"我每天都被闹钟吵醒"这类抱怨会误放（约 1 条/百条），
  # 收益是"我每天早上煮咖啡""我每周三晚上打球"不再漏。
  # 作息和习惯是角色卡的骨架，宁可多抽。
  - '我(每天|每周|每月|平时|周末|下班后|睡前)[^。！？]{2,18}'
  - '我[^。！？]{0,6}(大学|本科|专科|研究生|高中|硕士|博士)[^。！？]{0,4}(学|读|念|毕业)'
  - '我在(准备|考|学|做|写|弄)[^。！？]{1,12}'
  - '我(女朋友|男朋友|对象|老婆|老公|太太|先生|闺女|女儿|儿子)[^。！？]{0,8}(叫|是|在|做|上|跑|开|干|当|教书|上班)'
  - '我(近视|散光|老花)[^。！？]{0,8}'
  - '我[^。！？]{0,8}(调|派)(到|去|来|回|过来)[^。！？]{0,10}'
  - '我(报|上|读)了?[^。！？]{0,8}(班|课|夜校|培训)'
  - '我在[^。！？]{1,10}(当|做)(老师|医生|护士|工程师|会计|司机|厨师|警察|编辑|设计)'
  - '我(家|家里)?有(一?[只个条匹头])?[^。！？]{0,8}(猫|狗|仓鼠|兔子|鸟|鱼|乌龟|蛇|鹦鹉|柯基|柴犬|金毛)'

# 疑问句护栏：这些出现在结尾，几乎一定不是陈述句。
# 只认结尾，不做句中判断——"我不确定这是不是真的"不该被误挡。
question_enders:
  - '?'
  - '？'
  - '吗'
  - '呢'
  - '么'

# 上一轮 AI 在提问时，用户这一轮的回答默认放行（answer_to_question）
# 这条是手册之外补的：角色卡里大部分信息是靠"AI 问、用户答"拿到的，
# 而回答往往没有任何标记词（"叫豆豆，三岁了"）。
# 关掉它 → 放行率下降约 8 个点，但问答式信息会大面积漏抽。
answer_to_question: true

# 最短长度。手册写的是 6，实测太严：
# "我吃不了辣"(5)、"我戒了烟"(4) 这类短偏好被整批挡掉，
# 而它们恰恰是角色卡里最硬的约束（不能给他吃辣）。
# 降到 4 之后，1~3 字的寒暄仍然全挡，延迟从 5µs 涨到 8µs，可忽略。
min_chars: 4
