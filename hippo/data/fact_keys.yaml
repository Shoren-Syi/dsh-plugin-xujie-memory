# 事实词表（M8.1）
#
# 为什么要有这张表
# ----------------
# 抽取器把"住在哪""做什么工作"当成 fact 单独存，因为这两类信息
# **会变，而且变了之后旧值必须失效**。事件是流水账，事实是当前状态。
#
# 但事实的 key 一旦自由生长，就等于没有 key：
# 实测 8 个窗口，模型给了 11 条 fact、11 个不同的 key ——
# `居住城市` 和 `居住地` 同时存在，两者都在描述"住哪"。
# 后续"搬到上海"只会顶掉其中一个，另一个永远 active。
# 同一件事有两个当前值，比没有事实更糟：模型会二选一，随机。
#
# 所以：**key 必须闭集**。模型给了表外的 key，这条 fact 不写。
#
# 字段
# ----
#   cn      给模型看的中文名（prompt 里就是它）
#   card    single = 同一实体同时只能有一个值；multi = 可以并存多个
#   type    place / org / enum / number / text，决定值怎么归一
#   aliases 模型可能写的其他说法（英文、近义中文），一律映射到本 key
#
# card 的取舍
# -----------
# 矛盾检测只在 single 上有定义。"住在哪"只能有一个答案，
# "不吃什么"可以有五个。把 diet 设成 single，第二样忌口进来的那一刻
# 就会把第一样顶掉 —— 那是**丢信息**，不是"更新"。
# 所以 multi 类型的 key 只做去重插入，永不关闭旧值。
#
# 加新 key 的原则
# --------------
# 只有当"同一实体同时有两个值"在语义上**不可能**成立时才加 single。
# 拿不准就 multi —— 多一条并存的事实只是啰嗦，错关一条是丢数据。

version: 1

keys:

  # ---------------------------------------------------------------- 地点
  city:
    cn: 居住城市
    card: single
    type: place
    aliases: [居住城市, 居住地, 城市, 常驻地, 常住城市, 所在地, 住在哪, 现居, 住址]
  district:
    cn: 居住区县
    card: single
    type: place
    aliases: [居住区县, 居住区, 区县, 城区, 住在哪个区, 小区, 街区]
  hometown:
    cn: 家乡
    card: single
    type: place
    aliases: [家乡, 老家, 故乡, 籍贯, 老家在哪]

  # ---------------------------------------------------------------- 工作
  occupation:
    cn: 职业
    card: single
