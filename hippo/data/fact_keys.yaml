  commute:
    cn: 通勤方式
    card: single
    type: enum
    aliases: [通勤方式, 通勤, 上班方式, 怎么上班, 交通工具, 出行方式]

  # ---------------------------------------------------------------- 人
  age:
    cn: 年龄
    card: single
    type: number
    aliases: [年龄, 岁数, 多大, 年纪, age]
  birthday:
    cn: 生日
    card: single
    type: date
    aliases: [生日, 出生日期, 哪天生日, birthday]
  partner:
    cn: 伴侣
    card: single
    type: text
    aliases: [伴侣, 对象, 配偶, 老公, 老婆, 男朋友, 女朋友, 已婚]
  child:
    cn: 子女
    card: multi
    type: text
    aliases: [子女, 孩子, 儿子, 女儿, 几个孩子]
  family:
    cn: 家庭成员
    card: multi
    type: text
    aliases: [家庭成员, 家人, 父母, 兄弟姐妹]

  # ---------------------------------------------------------------- 宠物
  pet:
    cn: 宠物
    card: multi
    type: text
    aliases: [宠物, 养的动物, 养什么, 猫, 狗]
  pet_name:
    cn: 宠物名
