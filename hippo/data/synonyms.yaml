# 同义词组（M10.3）
#
# 格式：一行一组，组内任意两个词互相当同义词。用 `[a, b, c]` 的 YAML 流式写法，
# 因为这张表要经常改（M26 会按真机数据补），一屏能看十几组比缩进好读。
#
# ## 这张表解决什么
#
# n-gram 只能覆盖**字面重叠**。用户问"我在哪上班"，库里存的是"字节 后端 工作年限"，
# 两个字都不重叠，倒排一条也命中不了——L1 又认不出实体，于是候选全库、
# 关键词 0 命中、只能按 weight 兜底，AI 答非所问。
#
# ## 三条自我约束
#
# 1. **组是双向的**，不是"查询词 → 库词"。单向映射等于把答案写进规则，
#    下次库里换个说法就不成立了。
# 2. **按生活类别分组**，不按具体事件。写"搬家"组是因为人一生会搬很多次，
#    不是为了命中某一条记忆。
# 3. **宁可少一组，不要宽一组**。"吃"和"喝"不能同组——它们区分度太低，
#    合并后"我能吃辣吗"会把所有饮食事件都捞上来。
#
# ## 单字触发词的风险
#
# "住""睡""猫"这些单字是有效的触发词（"我几点睡"里只有"睡"这一个线索），
# 但"住"也出现在"记住""住院"里。所以 lexicon 只在**短查询**（≤12 字）时
# 启用单字触发：长句里单字误触发的概率高，收益低。

