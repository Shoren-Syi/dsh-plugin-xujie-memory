            ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(alpha * 0.07).toFixed(3)})`;
            ctx.lineWidth = lw * 4.2;
            ctx.stroke();
          }
          ctx.globalCompositeOperation = bd >= 3 ? "lighter" : "source-over";
          // 受光面更白：粗主干上的点光源感。
          const lift = lc === 2 ? 0.32 : lc === 1 ? 0.12 : 0;
          const r = Math.round(rgb[0] + (255 - rgb[0]) * lift), gg = Math.round(rgb[1] + (255 - rgb[1]) * lift), b2 = Math.round(rgb[2] + (255 - rgb[2]) * lift);
          ctx.strokeStyle = `rgba(${r},${gg},${b2},${alpha.toFixed(3)})`;
          ctx.lineWidth = lw;
          ctx.stroke();
        }
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  drawEdgeBand(bd, band, fog, zoomW) {
    if (!this.edges.length) return;
    const { ctx } = this;
    const sel = this.hover >= 0 ? this.hover : this.selected;
    ctx.lineCap = "round";
    for (let pass = 0; pass < 3; pass++) {
      for (let layer = 0; layer < 3; layer++) {
        ctx.beginPath();
        let any = false;
        for (let e = 0; e < this.edges.length; e++) {
          const edge = this.edges[e];
          if (!this.clusters[edge.s] || !this.clusters[edge.t]) continue;
          if (edge.layer !== layer) continue;
          const active = sel >= 0 && (edge.s === sel || edge.t === sel);
          const hl = this.highlight !== null && (this.highlight.has(edge.s) || this.highlight.has(edge.t));
          const fading = this.fading >= 0 && (edge.s === this.fading || edge.t === this.fading);
          if ((fading ? 2 : active || hl ? 1 : 0) !== pass) continue;
          let pen = false;
          for (let j = 0; j < EDGE_SAMPLES - 1; j++) {
            const o = (e * EDGE_SAMPLES + j) * 3;
            const z = (this.edgeScr[o + 2] + this.edgeScr[o + 5]) * 0.5;
            if (band(z) !== bd) { pen = false; continue; }
            if (!pen) { ctx.moveTo(this.edgeScr[o], this.edgeScr[o + 1]); pen = true; }
            ctx.lineTo(this.edgeScr[o + 3], this.edgeScr[o + 4]);
            any = true;
          }
        }
        if (!any) continue;
        const rgb = LAYER_RGB[layer];
        const quiet = sel >= 0 || this.highlight !== null;
        const fade = Math.max(0, Math.min(1, (this.fadeUntil - performance.now()) / 300));
        const alpha = pass === 2 ? 0.9 * fade : pass === 1 ? 0.9 : quiet ? 0.1 : 0.27;
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(alpha * fog * 0.35).toFixed(3)})`;
        ctx.lineWidth = (pass === 1 ? 5 : 3) * zoomW;
        ctx.stroke();
        ctx.strokeStyle = `rgba(${Math.min(255, rgb[0] + 40)},${Math.min(255, rgb[1] + 30)},${Math.min(255, rgb[2] + 30)},${(alpha * fog).toFixed(3)})`;
        ctx.lineWidth = (pass === 1 ? 1.4 : 0.8) * zoomW;
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  drawNode(i, fog, dim) {
    const { ctx } = this;
    const nd = this.nodes[i];
    const x = this.nsx[i], y = this.nsy[i];
    const w = Math.max(0, Math.min(1, nd.weight));
    // 权重亮度：低权重是快熄灭的暗点，高权重是亮光（低权重仍留可见微光）
    let alpha = fog * (0.18 + Math.pow(w, 1.2) * 0.82);
    if (alpha <= 0) return;
    const focusSet = this.highlight;
    const isSel = i === this.selected, isHover = i === this.hover;
    const focus = this.hover >= 0 ? this.hover : this.selected;
    const related = i === focus || this.neighbours.has(i);
    if (focusSet && !focusSet.has(i)) alpha *= 0.22;
    else if (focus >= 0 && !related) alpha *= 0.3;
    if (i === this.fading) alpha *= Math.max(0, Math.min(1, (this.fadeUntil - performance.now()) / 300));
    alpha *= dim;
    const r = this.nodeRadius(i) * (isHover || isSel ? 1.35 : 1);
    const fl = this.flash[i];
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = Math.min(1, alpha * (0.38 + fl * 0.6 + (focusSet && focusSet.has(i) ? 0.4 : 0)));
    const halo = r * (3.0 + fl * 3);
    ctx.drawImage(this.nodeSprite(i), x - halo, y - halo, halo * 2, halo * 2);
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.globalCompositeOperation = "source-over";
    const rgb = this.nodeColor(i);
    ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(0.5 + w * 0.45).toFixed(3)})`;
    if (nd.derived) {
      // 派生/只读记录：菱形轮廓，绝不与原始记录同形。
      ctx.beginPath();
      ctx.moveTo(x, y - r * 1.25); ctx.lineTo(x + r * 1.25, y); ctx.lineTo(x, y + r * 1.25); ctx.lineTo(x - r * 1.25, y); ctx.closePath();
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = Math.max(1, r * 0.42);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fill();
    }
    if (this.clusters[i] > 1) {
      ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha * 0.6})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(x, y, r + 3, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  drawSoma(_light, dim) {
    const { ctx } = this;
    const { x, y, r } = this.somaScreen;
    // 中心以柔和光场表现神经活动，记忆节点仍由各层真实记录决定。
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3.5);
    glow.addColorStop(0, `rgba(245,250,255,${0.8 * dim})`);
    glow.addColorStop(0.08, `rgba(207,228,255,${0.45 * dim})`);
    glow.addColorStop(0.4, `rgba(148,190,241,${0.12 * dim})`);
    glow.addColorStop(1, "rgba(100,150,220,0)");
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, r * 3.5, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  drawPulses(project, front, somaZ) {
    if (this.opts.reducedMotion) return;
    const { ctx, m } = this;
    const tmp = new Float32Array(3);
    ctx.globalCompositeOperation = "lighter";
    const at = (p, t) => {
      if (t < 0) return null;
      const cum = p.cum;
      let lo = 0, hi = cum.length - 1;
      if (t <= cum[0]) {
        const v = p.path[0];
        return [m.x[v], m.y[v], m.z[v]];
      }
      while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (cum[mid] < t) lo = mid; else hi = mid; }
      const a = p.path[lo], b = p.path[hi];
      const k = (t - cum[lo]) / Math.max(1e-3, cum[hi] - cum[lo]);
      return [m.x[a] + (m.x[b] - m.x[a]) * k, m.y[a] + (m.y[b] - m.y[a]) * k, m.z[a] + (m.z[b] - m.z[a]) * k];
    };
    for (const p of this.pulses) {
      const head = at(p, p.t);
      if (!head) continue;
      const k = project(head[0], head[1], head[2], tmp, 0);
      if ((tmp[2] <= somaZ) !== front) continue;
      const hx = tmp[0], hy = tmp[1];
      const fade = Math.min(1, p.t / 60) * Math.min(1, (p.total - p.t) / 40 + 0.3);
      const s = 5 * k * Math.max(0.7, this.fBase * this.zoom);
      ctx.globalAlpha = 0.9 * fade;
      ctx.drawImage(this.whiteSprite, hx - s, hy - s, s * 2, s * 2);
      ctx.globalAlpha = 1;
    }
    for (const ep of this.edgePulses) {
      if (ep.t < 0) continue;
      const pos = ep.t * (EDGE_SAMPLES - 1), j = Math.min(EDGE_SAMPLES - 2, Math.floor(pos)), u = pos - j;
      const o = (ep.edge * EDGE_SAMPLES + j) * 3;
      const x = this.edgeScr[o] + (this.edgeScr[o + 3] - this.edgeScr[o]) * u;
      const y = this.edgeScr[o + 1] + (this.edgeScr[o + 4] - this.edgeScr[o + 1]) * u;
      const z = this.edgeScr[o + 2];
      if ((z <= somaZ) !== front) continue;
      const edge = this.edges[ep.edge];
      const s = 6 * Math.max(0.7, this.fBase * this.zoom);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(this.sprites[edge.layer], x - s, y - s, s * 2, s * 2);
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = "source-over";
  }

  drawDust(project, dim) {
    const { ctx } = this;
    const tmp = new Float32Array(3);
    ctx.globalCompositeOperation = "lighter";
    for (let li = 0; li < 3; li++) {
      const d = this.m.dust[li];
      const rgb = LAYER_RGB[li];
      ctx.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
      for (let i = 0; i < d.length; i += 4) {
        const k = project(d[i], d[i + 1], d[i + 2], tmp, 0);
        const tw = this.opts.reducedMotion ? 0.7 : 0.55 + 0.45 * Math.sin(this.time * 0.9 + d[i + 3]);
        const depth = Math.max(0.15, Math.min(1, 1 - (tmp[2] - this.somaScreen.z) / 700));
        ctx.globalAlpha = 0.32 * tw * depth * dim;
        const s = Math.max(0.8, 1.5 * k * this.fBase * this.zoom);
        ctx.fillRect(tmp[0] - s / 2, tmp[1] - s / 2, s, s);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /** 层边界环：后半环先画，前半环最后画，附带层标签。 */
  drawStrata(project, dim, back) {
    const { ctx } = this;
    const point = new Float32Array(3);
    const captions = [];
    for (let layer = 0; layer < STRATA.length; layer++) {
      const stratum = STRATA[layer], rgb = LAYER_RGB[layer];
      for (const ratio of [1, 1.035]) {
        ctx.beginPath();
        let drawing = false;
        for (let i = 0; i <= 160; i++) {
          const angle = i / 160 * TAU;
          project(Math.cos(angle) * stratum.radius * ratio, stratum.y, Math.sin(angle) * stratum.radius * ratio, point, 0);
          if ((point[2] > this.somaScreen.z) !== back) { drawing = false; continue; }
          if (drawing) ctx.lineTo(point[0], point[1]); else { ctx.moveTo(point[0], point[1]); drawing = true; }
        }
        ctx.strokeStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${(dim * (back ? 0.13 : 0.36)).toFixed(3)})`;
        ctx.lineWidth = 0.8; ctx.stroke();
      }
      if (!back) {
        let right = -Infinity, rightY = 0;
        for (let i = 0; i < 80; i++) {
          const angle = i / 80 * TAU;
          project(Math.cos(angle) * stratum.radius, stratum.y, Math.sin(angle) * stratum.radius, point, 0);
          if (point[0] > right) { right = point[0]; rightY = point[1]; }
        }
        const label = this.opts.layerCaptions[layer];
        ctx.font = '600 14px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
        const width = ctx.measureText(label).width;
        captions.push({ label, layer, x: Math.max(12, Math.min(this.width - width - 18, right + 12)), y: rightY, width });
      }
    }
    if (back) return;
    captions.sort((a, b) => a.y - b.y);
    const minY = Math.min(this.height * 0.35, this.width < 450 ? 174 : 116);
    const maxY = Math.max(minY + 64, this.height - 104);
    for (let i = 0; i < captions.length; i++) captions[i].y = Math.max(minY, Math.min(maxY - (captions.length - 1 - i) * 32, captions[i].y), i ? captions[i - 1].y + 32 : minY);
    this.captionBoxes = [];
    for (const c of captions) {
      const rgb = LAYER_RGB[c.layer];
      ctx.fillStyle = "rgba(8,10,16,0.85)";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(c.x - 8, c.y - 16, c.width + 16, 23, 6); else ctx.rect(c.x - 8, c.y - 16, c.width + 16, 23);
      ctx.fill();
      ctx.font = '600 14px ui-sans-serif, system-ui, "Microsoft YaHei", sans-serif';
      ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.97)`;
      ctx.fillText(c.label, c.x, c.y);
      this.captionBoxes.push({ x: c.x - 8, y: c.y - 16, width: c.width + 16, height: 23 });
    }
  }

  drawSelection() {
    const { ctx } = this;
    const mark = (i, strong) => {
      if (i < 0 || i >= this.nodes.length) return;
      const x = this.nsx[i], y = this.nsy[i], r = this.nodeRadius(i) * 1.35 + 7;
      const rgb = LAYER_RGB[this.nodes[i].layer];
      ctx.strokeStyle = `rgba(${Math.min(255, rgb[0] + 60)},${Math.min(255, rgb[1] + 50)},${Math.min(255, rgb[2] + 40)},${strong ? 0.95 : 0.6})`;
      ctx.lineWidth = strong ? 1.5 : 1;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
      if (strong) {
        ctx.beginPath();
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          ctx.moveTo(x + dx * (r + 3), y + dy * (r + 3)); ctx.lineTo(x + dx * (r + 9), y + dy * (r + 9));
        }
        ctx.stroke();
      }
    };
    if (this.highlight) for (const i of this.highlight) if (i !== this.selected) mark(i, false);
    mark(this.selected, true);
  }
}

/* ======================================================================
   看板 UI：数据只来自内核 GET /board/data（store.board_snapshot）。
   ====================================================================== */

// ---------- 小图标（16px stroke） ----------
const svg = (inner) => `<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">${inner}</svg>`;
const ICON = {
  pause: svg('<path d="M5 3v10M11 3v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'),
  play: svg('<path d="M5.5 3.8v8.4l7-4.2z" fill="currentColor"/>'),
  minus: svg('<path d="M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'),
  plus: svg('<path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'),
  reset: svg('<path d="M13.4 8A5.4 5.4 0 1 1 8 2.6c1.9 0 3.5.9 4.5 2.4M12.9 2.4v2.8h-2.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'),
  refresh: svg('<path d="M2.6 8a5.4 5.4 0 1 0 1.6-3.8M2.6 2.5v2.7h2.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/>'),
  back: svg('<path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'),
  close: svg('<path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'),
  search: svg('<circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.2 10.2L13.8 13.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'),
  alert: svg('<path d="M8 2.2L14.6 13H1.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.4v3.2M8 11.2v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'),
};

// ---------- 常量 ----------
// 海马体自己的三层：持久记忆层 / 重点标注层 / 遗忘权重池；存疑池外挂。
const LAYER_INDEX = { persistent: 0, pinned: 1, forgotten: 2 };
const LAYER_NAME = ["持久记忆", "重点标注", "遗忘权重池"];
const LAYER_EN = ["PERSISTENT", "PINNED", "FORGETTING"];
const KIND_LABEL = { event: "事件", fact: "事实", trait: "特征", entity: "人物", turn: "原话", doubt: "存疑" };
const TIER_NAME = { 1: "hot", 2: "warm", 3: "cold" };
const TIER_LABEL = { hot: "hot · 热", warm: "warm · 温", cold: "cold · 冷" };
const TAB_OF_KIND = { event: "events", fact: "facts", entity: "entities", trait: "entities", turn: "events", doubt: "doubts" };
const TAB_TITLE = { events: "事件", facts: "事实", entities: "人物", doubts: "存疑池", qq: "QQ 接入", status: "状态" };

// ---------- 数据源：http(s) 同源；file:// 或 ?api= 时指向内核端口 ----------
const API = (() => {
  const q = new URLSearchParams(location.search).get("api");
  if (q) return q.replace(/\/+$/, "");
  if (location.protocol === "http:" || location.protocol === "https:") return "";
  return "http://127.0.0.1:8766"; // file:// 直开时连内核默认端口
})();

// ---------- 工具 ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = (ts) => {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const fmtConf = (v) => (v === null || v === undefined) ? "—" : Number(v).toFixed(2);
const baseName = (p) => String(p || "").split(/[\\/]/).pop() || "mem.db";

// ---------- 全局状态 ----------
const state = {
  data: null,
  tab: "events",
  query: "",
  detailId: null,      // 详情视图对应的节点 id（event:3 / entity:5 …）
  expanded: false,
  fingerprint: "",
  autoRotate: true,
  resumeRotate: false,
  failed: false,
};

// ---------- 引擎挂载 ----------
const wrap = $("fieldWrap"), canvas = $("cv"), tip = $("tip");
const reducedMotion = () => typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
let engine = null;
try {
  engine = new NeuralEngine(canvas, tip, {
    reducedMotion: reducedMotion(),
    layerCaptions: ["语义 SEMANTIC", "情节 EPISODIC", "工作 WORKING"],
    onSelect: (id) => onFieldSelect(id),
  });
} catch (err) {
  const p = document.createElement("p");
  p.className = "field-fallback";
  p.textContent = "此环境无法绘制神经图。右侧列表仍可检索全部记忆。";
  wrap.appendChild(p);
  canvas.remove();
}
if (engine) {
  const ro = new ResizeObserver((entries) => {
    const r = entries[0] && entries[0].contentRect;
    if (r) engine.resize(r.width, r.height);
  });
  ro.observe(wrap);
  const rect = wrap.getBoundingClientRect();
  engine.resize(rect.width, rect.height);
  if (typeof IntersectionObserver === "function") {
    new IntersectionObserver((entries) => engine.setVisible(entries.some(e => e.isIntersecting))).observe(wrap);
  }
  engine.start();
  // 调试/验收用句柄：CDP 测试要读 ringAngle、somaScreen 这些内部量。
  // 只挂在 window 上，不参与任何业务逻辑。
  window.__hippoBoard = engine;
  if (typeof matchMedia === "function") {
    matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", () => {
      engine.setOptions({ reducedMotion: reducedMotion(), layerCaptions: engine.opts.layerCaptions, onSelect: (id) => onFieldSelect(id) });
      syncRotateButton();
    });
  }
}

// ---------- 快照 → 场数据 ----------
function toField(d) {
  // 存疑池外挂，不进三维场；只映射三层。
  const nodes = (d.nodes || []).filter((n) => LAYER_INDEX[n.layer] !== undefined).map((n) => ({
    id: n.id,
    layer: LAYER_INDEX[n.layer],
    derived: n.kind !== "event",
    weight: Math.max(0.3, Math.min(1, Number(n.priority) || 0.5)),
    label: String(n.content || ""),
    kindLabel: KIND_LABEL[n.kind] || n.kind,
    kind: n.kind,
  }));
  const edges = (d.edges || []).map((e) => ({ source: e.source, target: e.target }));
  return { nodes, edges };
}

function layerCounts(d) {
  const c = [0, 0, 0];
  for (const n of d.nodes || []) {
    const i = LAYER_INDEX[n.layer];
    if (i !== undefined) c[i]++;   // 存疑池外挂，不计入三层
  }
  return c;
}

// ---------- 记录查找（详情按 id 前缀落到真实数组） ----------
function findRecord(id) {
  const d = state.data;
  if (!d || !id) return null;
  const i = id.indexOf(":");
  const kind = id.slice(0, i), rest = id.slice(i + 1);
  const node = (d.nodes || []).find((n) => n.id === id) || null;
  let record = null;
  if (kind === "event") record = (d.events || []).find((e) => String(e.id) === rest) || null;
  else if (kind === "fact") record = (d.facts || []).find((f) => f.key === rest) || null;
  else if (kind === "entity") record = (d.entities || []).find((e) => String(e.id) === rest) || null;
  else if (kind === "turn") record = (d.turns || []).find((t) => `${t.session}:${t.idx}` === rest) || null;
  else if (kind === "doubt") record = (d.doubts || []).find((x) => String(x.id) === rest) || null;
  return { kind, rest, node, record };
}

// ---------- 渲染：副标题 / 仪表条 ----------
function renderHead(d) {
  const c = d.counts || {};
  const nodes = (d.nodes || []).length, edges = (d.edges || []).length;
  $("sub").textContent = `${nodes} 个节点 · ${edges} 条关联 · 事件 ${c.events ?? 0} / 事实 ${c.facts ?? 0} / 人物 ${c.entities ?? 0} / 存疑 ${c.doubts ?? 0}`;
  const extractStatus = $("extractStatus");
  extractStatus.hidden = d.extraction_configured !== false;
  extractStatus.textContent = d.extraction_configured === false ? "未配置 API key：仅保存对话，暂不自动提取记忆。" : "";
  const t = d.tiers || {};
  const layers = layerCounts(d);
  $("console").innerHTML = `
    <div class="console-cell console-intro">
      <span class="console-kicker">HIPPO / MEMORY</span>
      <strong>记忆总览</strong>
      <span class="console-muted">${esc(baseName(d.db))} · 轮次 ${c.turns ?? 0}</span>
    </div>
    <div class="console-cell">
      <span class="console-label">事件 <small>EVENTS</small></span>
      <strong class="console-number console-amber">${c.events ?? "—"}</strong>
      <span class="console-muted">hot ${t.hot ?? 0} · warm ${t.warm ?? 0} · cold ${t.cold ?? 0}</span>
    </div>
    <div class="console-cell">
      <span class="console-label">事实 <small>FACTS</small></span>
      <strong class="console-number console-blue">${c.facts ?? "—"}</strong>
      <span class="console-muted">当前有效</span>
    </div>
    <div class="console-cell">
      <span class="console-label">人物 <small>ENTITIES</small></span>
      <strong class="console-number">${c.entities ?? "—"}</strong>
      <span class="console-muted">已识别</span>
    </div>
    <div class="console-cell console-layers">
      <span class="console-label">三层节点 <small>IN VIEW</small></span>
      <div class="console-layer-list">
        ${layers.map((n, i) => `<span data-layer="${i}"><i></i>${LAYER_NAME[i]}<b>${n}</b></span>`).join("")}
      </div>
    </div>
    <div class="console-cell">
      <span class="console-label">关联 <small>EDGES</small></span>
      <strong class="console-number console-cyan">${edges}</strong>
      <span class="console-muted">图中真实关联</span>
    </div>`;
  for (const [k, v] of [["events", c.events], ["facts", c.facts], ["entities", c.entities], ["doubts", c.doubts]]) {
    const el = document.querySelector(`[data-count="${k}"]`);
    if (el) el.textContent = v ?? "";
  }
  if (engine) {
    engine.opts.layerCaptions = layers.map((n, i) => `${LAYER_NAME[i]} ${LAYER_EN[i]} · ${n}`);
    engine.invalidate();
  }
}

// ---------- 渲染：列表 ----------
function filteredItems() {
  const d = state.data;
  const q = state.query.trim().toLowerCase();
  const hit = (...ss) => !q || ss.some((s) => String(s || "").toLowerCase().includes(q));
  if (!d) return [];
  if (state.tab === "events") {
    return (d.events || []).filter((e) => hit(e.summary, e.raw_preview, e.keywords, e.session)).map((e) => ({ type: "event", e }));
  }
  if (state.tab === "facts") {
    return (d.facts || []).filter((f) => hit(f.key, f.value, f.session)).map((f) => ({ type: "fact", f }));
  }
  if (state.tab === "doubts") {
    return (d.doubts || []).filter((x) => hit(x.question, x.session)).map((x) => ({ type: "doubt", x }));
  }
  return (d.entities || []).filter((en) => hit(en.canonical, en.type, en.aliases)).map((en) => ({ type: "entity", en }));
}

function mark(text) {
  const q = state.query.trim();
  const s = String(text ?? "");
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + `<mark class="mark">` + esc(s.slice(i, i + q.length)) + `</mark>` + esc(s.slice(i + q.length));
}

function renderList() {
  const body = $("inspBody");
  // QQ 接入 / 状态是表单而不是记忆列表：单独渲染，不参与搜索高亮。
  if (state.tab === "qq") { renderQQ(); return; }
  if (state.tab === "status") { renderStatus(); return; }
  const items = filteredItems();
  const q = state.query.trim();
  const total = state.data
    ? (state.tab === "events" ? (state.data.events || []).length : state.tab === "facts" ? (state.data.facts || []).length : (state.data.entities || []).length)
    : 0;

  // 搜索高亮同步到三维场
  let inField = 0;
  if (engine) {
    if (!q) { engine.setHighlight(null); }
    else {
      const ids = items.map((it) => it.type === "event" ? `event:${it.e.id}` : it.type === "fact" ? `fact:${it.f.key}` : `entity:${it.en.id}`);
      inField = engine.setHighlight(ids);
    }
  }

  let html = "";
  if (q) {
    html += `<p class="result-count">${items.length} 条结果${inField < items.length ? ` · ${items.length - inField} 条在图外` : ""}</p>`;
  }
  if (!items.length) {
    const emptyText = q
      ? `没有找到与「${esc(q)}」相关的${TAB_TITLE[state.tab]}。`
      : state.tab === "events" ? "还没有事件。在 DSH 里正常聊天，攒够轮数后自动抽取。"
      : state.tab === "facts" ? "还没有事实。对话中出现地名、偏好等信息后会自动抽取。"
      : "还没有认出的人物。对话中提到人物后会自动建立档案。";
    html += `<div class="status"><p class="status-title">${q ? "没有结果" : "暂无记录"}</p><p class="status-body">${emptyText}</p></div>`;
    body.innerHTML = html;
    return;
  }
  html += '<ul class="list">';
  for (const it of items) {
    if (it.type === "event") {
      const e = it.e;
      const tier = TIER_NAME[e.tier] || "warm";
      const id = `event:${e.id}`;
      const kws = String(e.keywords || "").split(/\s+/).filter(Boolean).slice(0, 4);
      html += `<li><button type="button" class="row" data-id="${esc(id)}" data-tier="${tier}" aria-current="${state.detailId === id}">
        <span class="row-lead"><span class="badge" data-tier="${tier}">${tier}</span><span class="row-meta">${fmtTime(e.event_time)}</span>${e.pinned ? '<span class="badge badge-muted">pin</span>' : ""}</span>
        <span class="row-text">${mark(e.summary || e.raw_preview || "（无摘要）")}</span>
        ${kws.length ? `<span class="row-meta">${kws.map((k) => `<span class="kw">${esc(k)}</span>`).join(" ")}</span>` : ""}
      </button></li>`;
    } else if (it.type === "fact") {
      const f = it.f;
      const id = `fact:${f.key}`;
      const owner = (state.data.entities || []).find((en) => en.id === f.entity_id);
      html += `<li><button type="button" class="row" data-id="${esc(id)}" aria-current="${state.detailId === id}">
        <span class="row-lead"><span class="badge" data-layer="0">事实</span><span class="row-meta">${esc(f.key)}</span>${owner ? `<span class="row-meta">· ${esc(owner.canonical)}</span>` : ""}</span>
        <span class="row-text row-text-1">${mark(f.value)}</span>
        <span class="row-meta">置信 ${fmtConf(f.confidence)}</span>
      </button></li>`;
    } else if (it.type === "doubt") {
      const x = it.x;
      const id = `doubt:${x.id}`;
      html += `<li><button type="button" class="row" data-id="${esc(id)}" aria-current="${state.detailId === id}">
        <span class="row-lead"><span class="badge" data-layer="1">存疑</span><span class="row-meta">${esc(x.session || "")}</span></span>
        <span class="row-text">${mark(x.question)}</span>
        <span class="row-meta">影响 ${fmtConf(x.impact)} · 成本 ${fmtConf(x.cost)}</span>
      </button></li>`;
    } else {
      const en = it.en;
      const id = `entity:${en.id}`;
      const aliases = String(en.aliases || "").split(/[,，;；\s]+/).filter(Boolean).slice(0, 3);
      html += `<li><button type="button" class="row" data-id="${esc(id)}" aria-current="${state.detailId === id}">
        <span class="row-lead"><span class="avatar">${esc(String(en.canonical || "?").slice(0, 1))}</span>
          <span style="min-width:0"><span class="row-text row-text-1">${mark(en.canonical)}</span>
          <span class="row-meta">${esc(en.type || "person")} · 置信 ${fmtConf(en.confidence)}</span></span></span>
        ${aliases.length ? `<span class="row-meta">别名 ${aliases.map(esc).join("、")}</span>` : ""}
      </button></li>`;
    }
  }
  html += "</ul>";
  body.innerHTML = html;
  body.querySelectorAll(".row").forEach((el) => el.addEventListener("click", () => openDetail(el.dataset.id)));
}

// ---------- 渲染：详情 ----------
function metaRow(k, v, mono) {
  return `<div><dt>${esc(k)}</dt><dd${mono ? ' class="mono"' : ""}>${v}</dd></div>`;
}

function renderDetail(id) {
  const body = $("inspBody");
  const found = findRecord(id);
  if (!found || !found.node) { state.detailId = null; renderList(); return; }
  const { kind, node, record } = found;
  const isDoubt = kind === "doubt";
  const layer = LAYER_INDEX[node.layer];
  const d = state.data;
  const head = `<div class="detail-head">
    <button type="button" class="icon-btn" id="btnBack" aria-label="返回列表">${ICON.back}</button>
    <span class="chip" data-layer="${isDoubt ? 1 : layer}"><i class="dot"></i>${isDoubt ? "存疑池" : LAYER_NAME[layer]}</span>
    <span class="kind-label">${KIND_LABEL[kind] || kind}</span>
    <span class="spacer"></span>
    ${node.derived ? '<span class="badge badge-muted">派生 · 只读</span>' : ""}
  </div>`;

  let main = "", meta = "", extra = "";
  if (kind === "event" && record) {
    const e = record;
    const tier = TIER_NAME[e.tier] || "warm";
    main = `<div class="content">${esc(e.summary || e.raw_preview || "（无摘要）")}</div>`;
    meta = '<dl class="meta">'
      + metaRow("层级", `<span class="badge" data-tier="${tier}">${TIER_LABEL[tier]}</span>`)
      + metaRow("时间", esc(fmtTime(e.event_time)))
      + metaRow("权重", Number(e.weight || 0).toFixed(2))
      + metaRow("置顶", e.pinned ? "是" : "否")
      + metaRow("会话", esc(e.session || "—"), true)
      + (e.keywords ? metaRow("关键词", String(e.keywords).split(/\s+/).filter(Boolean).map((k) => `<span class="kw">${esc(k)}</span>`).join(" ")) : "")
      + "</dl>";
    if (e.raw_preview) extra += `<section class="section"><h3 class="section-h">原文预览</h3><div class="content">${esc(e.raw_preview)}</div></section>`;
    // 同会话的相邻事件（真实关联）
    const siblings = (d.events || []).filter((x) => x.session === e.session && x.id !== e.id).slice(0, 6);
    if (siblings.length) {
      extra += `<section class="section"><h3 class="section-h">同会话事件 · ${siblings.length}</h3><ul class="list">`
        + siblings.map((x) => `<li><button type="button" class="row" data-id="event:${x.id}" data-tier="${TIER_NAME[x.tier] || "warm"}">
            <span class="row-meta">${fmtTime(x.event_time)}</span>
            <span class="row-text row-text-1">${esc(x.summary || x.raw_preview || "")}</span>
          </button></li>`).join("")
        + "</ul></section>";
    }
  } else if (kind === "fact" && record) {
    const f = record;
    const owner = (d.entities || []).find((en) => en.id === f.entity_id);
    main = `<div class="content">${esc(f.key)} = ${esc(f.value)}</div>`;
    meta = '<dl class="meta">'
      + metaRow("置信度", fmtConf(f.confidence))
      + (owner ? metaRow("所属人物", `<button type="button" class="btn" style="min-height:30px;padding:0 10px" data-jump="entity:${owner.id}">${esc(owner.canonical)}</button>`) : "")
      + metaRow("会话", esc(f.session || "—"), true)
      + "</dl>";
  } else if (kind === "doubt" && record) {
    const x = record;
    main = `<div class="content">${esc(x.question)}</div>`;
    meta = '<dl class="meta">'
      + metaRow("影响", fmtConf(x.impact))
      + metaRow("成本", fmtConf(x.cost))
      + metaRow("会话", esc(x.session || "—"), true)
      + "</dl>";
  } else if (kind === "entity" && record) {
    const en = record;
    main = `<div class="content">${esc(en.canonical)}</div>`;
    meta = '<dl class="meta">'
      + metaRow("类型", esc(en.type || "person"))
      + metaRow("置信度", fmtConf(en.confidence))
      + (en.aliases ? metaRow("别名", esc(en.aliases)) : "")
      + "</dl>";
    const facts = (d.facts || []).filter((f) => f.entity_id === en.id);
    if (facts.length) {
      extra += `<section class="section"><h3 class="section-h">相关事实 · ${facts.length}</h3><ul class="list">`
        + facts.map((f) => `<li><button type="button" class="row" data-id="fact:${esc(f.key)}">
            <span class="row-lead"><span class="badge" data-layer="0">事实</span><span class="row-meta">${esc(f.key)}</span></span>
            <span class="row-text row-text-1">${esc(f.value)}</span>
          </button></li>`).join("")
        + "</ul></section>";
    }
    const traits = (d.nodes || []).filter((n) => n.kind === "trait" && n.entity_id === en.id);
    if (traits.length) {
      extra += `<section class="section"><h3 class="section-h">特征 · ${traits.length}</h3><ul class="list">`
        + traits.map((t) => `<li><button type="button" class="row" data-id="${esc(t.id)}">
            <span class="row-text">${esc(t.content)}</span>
          </button></li>`).join("")
        + "</ul></section>";
    }
  } else if (kind === "trait") {
    main = `<div class="content">${esc(node.content)}</div>`;
    meta = '<dl class="meta">' + metaRow("置信度", fmtConf((node.priority || 1) / 2)) + "</dl>";
    const owner = (d.entities || []).find((en) => en.id === node.entity_id);
    if (owner) extra = `<section class="section"><h3 class="section-h">所属人物</h3><ul class="list"><li>
      <button type="button" class="row" data-id="entity:${owner.id}">
        <span class="row-lead"><span class="avatar">${esc(owner.canonical.slice(0, 1))}</span>
        <span class="row-text row-text-1">${esc(owner.canonical)}</span></span>
      </button></li></ul></section>`;
  } else if (kind === "turn" && record) {
    main = `<div class="content">${esc(record.content)}</div>`;
    meta = '<dl class="meta">'
      + metaRow("时间", esc(fmtTime(record.ts)))
      + metaRow("角色", esc(record.role || "user"))
      + metaRow("会话", esc(record.session || "—"), true)
      + "</dl>";
  } else if (kind === "doubt" && record) {
    main = `<div class="content">${esc(record.question)}</div>`;
    meta = '<dl class="meta">'
      + metaRow("影响", fmtConf(record.impact))
      + metaRow("成本", fmtConf(record.cost))
      + metaRow("会话", esc(record.session || "—"), true)
      + "</dl>";
  } else {
    main = `<div class="content">${esc(node.content)}</div>`;
  }

  body.innerHTML = head + main + meta + extra;
  $("btnBack").addEventListener("click", backToList);
  body.querySelectorAll(".row[data-id]").forEach((el) => el.addEventListener("click", () => openDetail(el.dataset.id)));
  body.querySelectorAll("[data-jump]").forEach((el) => el.addEventListener("click", () => openDetail(el.dataset.jump)));
  body.scrollTop = 0;
}

// ---------- 交互：选择 / 详情 / 视图 ----------
function openDetail(id) {
  const found = findRecord(id);
  if (!found || !found.node) return;
  state.detailId = id;
  const tab = TAB_OF_KIND[found.kind] || state.tab;
  if (tab !== state.tab) { state.tab = tab; state.query = ""; $("q").value = ""; $("btnClearQ").hidden = true; }
  setExpanded(true);
  syncNav();
  renderDetail(id);
  if (engine) {
    if (state.autoRotate && engine.isAutoRotating) state.resumeRotate = true;
    engine.setSelected(id);
  }
}

function backToList() {
  state.detailId = null;
  if (engine) engine.setSelected(null, false);
  syncNav();
  renderList();
}

function returnToGraph() {
  state.detailId = null;
  if (engine) {
    engine.setSelected(null, false);
    engine.resetView();
    if (state.resumeRotate && !reducedMotion()) { engine.setAutoRotate(true); syncRotateButton(); }
  }
  state.resumeRotate = false;
  renderList();
}

function onFieldSelect(id) {
  if (id === null) { if (state.detailId) returnToGraph(); return; }
  if (id === state.detailId) return;
  openDetail(id);
}

function setExpanded(on) {
  state.expanded = on;
  $("shell").classList.toggle("expanded", on);
  $("drawerMain").hidden = !on;
  if (on) syncNav();
}

function syncNav() {
  document.querySelectorAll(".nav-item").forEach((b) => {
    b.setAttribute("aria-current", state.expanded && !state.detailId && b.dataset.tab === state.tab ? "page" : "false");
  });
  $("drawerTitle").textContent = TAB_TITLE[state.tab] + (state.detailId ? " · 详情" : "");
}

// ---------- 覆盖层（加载 / 错误 / 空库） ----------
function showOverlay(kind, detail) {
  const ov = $("overlay");
  if (!kind) { ov.hidden = true; ov.innerHTML = ""; if (engine) engine.setDimmed(false); return; }
  ov.hidden = false;
  if (engine) engine.setDimmed(true);
  if (kind === "loading") {
    ov.innerHTML = `<div class="status-card"><span class="spinner"></span><p class="status-title">正在读取记忆</p></div>`;
  } else if (kind === "error") {
    ov.innerHTML = `<div class="status-card">
      <span class="status-icon">${ICON.alert}</span>
      <p class="status-title">连不上记忆内核</p>
      <p class="status-body">${esc(detail || "")}<br>请检查插件是否已启用，重启 DSH 后再重试。</p>
      <p style="margin:12px 0 0"><button type="button" class="btn btn-primary" id="btnRetry">重试</button></p>
    </div>`;
    $("btnRetry").addEventListener("click", () => load());
  } else if (kind === "empty") {
    ov.innerHTML = `<div class="status-card">
      <p class="status-title">还没有记忆</p>
      <p class="status-body">${state.data && state.data.extraction_configured === false
        ? "请先在 DSH 中配置 DeepSeek API key 并重启，再开始聊天。"
        : "在 DSH 里聊天几轮，海马体会自动抽取事件、事实与人物；<br>这里会随之生长出三层记忆场。"}</p>
    </div>`;
  }
}

// ---------- 数据加载（5s 轮询，指纹不变不重绘） ----------
async function load(manual) {
  const first = !state.data;
  if (first) showOverlay("loading");
  try {
    const dataPath = location.pathname === "/api/hippo.board" ? "/api/hippo.board.data" : API + "/board/data";
    const r = await fetch(dataPath, { cache: "no-store" });
    const d = await r.json();
    if (!d || d.ok === false) throw new Error((d && d.error) || "bad response");
    state.failed = false;
    const c = d.counts || {};
    const fp = JSON.stringify([c.events, c.facts, c.entities, c.turns, c.doubts, (d.nodes || []).length, (d.edges || []).length]);
    const changed = fp !== state.fingerprint;
    state.fingerprint = fp;
    state.data = d;
    renderHead(d);
    const empty = !(c.events || c.facts || c.entities || c.turns);
    showOverlay(empty ? "empty" : null);
    if (engine && changed) {
      const f = toField(d);
      engine.setData(f.nodes, f.edges);
      engine.setDoubts(d.doubts || []);   // 存疑池星环（外挂，真实数据）
    }
    if (state.detailId) {
      const found = findRecord(state.detailId);
      if (found && found.node) { if (changed) renderDetail(state.detailId); }
      else backToList();
    } else {
      renderList();
    }
  } catch (err) {
    state.failed = true;
    if (first || manual) showOverlay("error", String(err && err.message || err));
    $("sub").textContent = "读取失败：" + (err && err.message || err);
  }
}

// ---------- QQ 接入（表单式标签页） ----------
// 单位换算：内核用「百万分之一元」记金额，界面按「元」显示和输入。
const qqState = { settings: null, budget: null, error: "", busy: false };
const qqYuan = (microValue) => (Number(microValue || 0) / 1e6).toFixed(2);
const qqMicro = (yuanText) => Math.max(0, Math.round(Number(yuanText || 0) * 1e6));

async function qqFetch(path, options) {
  const res = await fetch(`${API}${path}`, options);
  let body = null;
  try { body = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
  return { ok: res.ok && body && body.ok === true, status: res.status, body };
}

async function qqLoad() {
  qqState.error = "";
  try {
    const s = await qqFetch("/qq/settings/active");
    qqState.settings = s.ok ? (s.body.settings || null) : null;
    const scope = qqState.settings?.budgetScope || qqState.settings?.selfId || "";
    if (scope) {
      const b = await qqFetch(`/qq/budget/status?scope=${encodeURIComponent(scope)}`);
      qqState.budget = b.ok ? b.body : null;
    } else {
      qqState.budget = null;
    }
  } catch (err) {
    qqState.error = (err && err.message) || "读取 QQ 配置失败";
  }
  if (state.tab === "qq" && !state.detailId) renderQQ();
}

function qqField(id, label, value, opts = {}) {
  const type = opts.type || "text";
  const ph = opts.placeholder || "";
  const hint = opts.hint ? `<span class="qq-hint">${esc(opts.hint)}</span>` : "";
  return `<label class="qq-field"><span>${esc(label)}</span>
    <input class="qq-input" id="${id}" type="${type}" value="${esc(value ?? "")}" placeholder="${esc(ph)}"${opts.disabled ? " disabled" : ""}>${hint}</label>`;
}

function qqReadForm() {
  const v = (id) => $(id).value.trim();
  const body = {
    selfId: v("qqSelf"), wsUrl: v("qqWs"), httpUrl: v("qqHttp"), accessToken: v("qqToken"),
    privateAllow: v("qqPrivate").split(/[,，\s]+/).filter(Boolean),
    groupAllow: v("qqGroup").split(/[,，\s]+/).filter(Boolean),
    requireMention: $("qqMention").checked,
    provider: v("qqProvider"), model: v("qqModel"),
    maxTokens: Number(v("qqMaxTokens") || 0), budgetScope: v("qqSelf"),
    schedule: {},
  };
  if ($("qqProOn")?.checked) {
    body.schedule.proactive = {
      enabled: true,
      intervalMinutes: Number(v("qqProMin") || 0),
      target: v("qqProTarget"),
      channel: v("qqProChannel") || "private",
      prompt: v("qqProPrompt"),
    };
  }
  if ($("qqQzoneOn")?.checked) {
    body.schedule.qzone = {
      enabled: true,
      intervalMinutes: Number(v("qqQzMin") || 0),
      visibility: Number(v("qqQzVis") || 64),
      prompt: v("qqQzPrompt"),
    };
  }
  const policy = {
    scope_id: v("qqSelf"), per_request: qqMicro(v("qqPerRequest")), daily: qqMicro(v("qqDaily")),
    monthly: qqMicro(v("qqMonthly")), input_price: qqMicro(v("qqInPrice")),
    output_price: qqMicro(v("qqOutPrice")), daily_calls: Number(v("qqDailyCalls") || 0),
    activity_limits: { chat: Number(v("qqDailyCalls") || 0) },
  };
  return { body, policy };
}

async function qqSave() {
  const { body, policy } = qqReadForm();
  const fail = (msg) => { qqState.error = msg; renderQQ(); };
  if (!/^\d{1,20}$/.test(body.selfId)) return fail("机器人 QQ 号必须是纯数字");
  if (!/^wss?:\/\//.test(body.wsUrl)) return fail("WebSocket 地址必须以 ws:// 或 wss:// 开头");
  if (!/^https?:\/\//.test(body.httpUrl)) return fail("HTTP 地址必须以 http:// 或 https:// 开头");
  const numOk = (n, name) => Number.isFinite(n) && n > 0 ? "" : `${name}必须是正数`;
  for (const [n, name] of [[policy.per_request, "单次预算"], [policy.daily, "每日预算"],
    [policy.monthly, "每月预算"], [policy.input_price, "输入价"], [policy.output_price, "输出价"],
    [policy.daily_calls, "每日次数"], [body.maxTokens, "最大输出 token"]]) {
    const msg = numOk(n, name);
    if (msg) return fail(msg);
  }
  if (body.schedule.proactive) {
    const p = body.schedule.proactive;
    if (!/^\d+$/.test(p.target)) return fail("主动发言对象必须是纯数字 QQ/群号");
    if (!(p.intervalMinutes >= 1 && p.intervalMinutes <= 1440)) return fail("主动发言间隔必须在 1~1440 分钟");
    if (!p.prompt.trim()) return fail("主动发言需要提示词");
    if (!["private", "group"].includes(p.channel)) return fail("主动发言范围只能是 private 或 group");
  }
  if (body.schedule.qzone) {
    const z = body.schedule.qzone;
    if (!(z.intervalMinutes >= 1 && z.intervalMinutes <= 1440)) return fail("空间动态间隔必须在 1~1440 分钟");
    if (![1, 4, 16, 64, 128].includes(z.visibility)) return fail("空间可见范围只能是 1/4/16/64/128");
    if (!z.prompt.trim()) return fail("空间动态需要内容要求");
  }
  qqState.busy = true;
  try {
    const saved = await qqFetch("/qq/settings", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
    });
    if (!saved.ok) throw new Error(saved.body?.error || `保存设置失败（HTTP ${saved.status}）`);
    const budget = await qqFetch("/qq/budget/configure", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(policy),
    });
    if (!budget.ok) throw new Error(budget.body?.error || `保存预算失败（HTTP ${budget.status}）`);
    await qqLoad();
    return true;
  } catch (err) {
    qqState.error = (err && err.message) || "保存失败";
    return false;
  } finally {
    qqState.busy = false;
    if (state.tab === "qq" && !state.detailId) renderQQ();
  }
}

async function qqStop() {
  qqState.busy = true;
  try {
    const res = await qqFetch("/qq/settings", { method: "DELETE" });
    if (!res.ok) throw new Error(res.body?.error || `停用失败（HTTP ${res.status}）`);
    await qqLoad();
  } catch (err) {
    qqState.error = (err && err.message) || "停用失败";
  } finally {
    qqState.busy = false;
    if (state.tab === "qq" && !state.detailId) renderQQ();
  }
}


// ---------- 运行状态（抽取实况） ----------
const statusState = { data: null, error: "", timer: null };

async function statusFetch(path) {
  const res = await fetch(`${API}${path}`);
  const body = await res.json().catch(() => null);
  return { ok: res.ok && body && body.ok === true, body };
}

async function loadStatus() {
  try {
    const r = await statusFetch("/stats");
    if (!r.ok) throw new Error(r.body?.error || "读取状态失败");
    statusState.data = r.body;
    statusState.error = "";
  } catch (err) {
    statusState.error = (err && err.message) || "读取状态失败";
  }
  if (state.tab === "status" && !state.detailId) renderStatus();
}

function statusRow(label, value, hint = "") {
  return `<div class="st-row"><span class="st-label">${esc(label)}</span>
    <strong class="st-value">${esc(value)}</strong>
    ${hint ? `<span class="st-hint">${esc(hint)}</span>` : ""}</div>`;
}

function renderStatus() {
  const body = $("inspBody");
  const d = statusState.data;
  if (!d) {
    body.innerHTML = `<p class="qq-note">${esc(statusState.error || "正在读取…")}</p>`;
    bindStatusButtons();
    return;
  }
  const last = d.last_extract;
  const lastText = last
    ? `${last.status}${last.n_events ? ` · ${last.n_events} 条` : ""}${last.error ? ` · ${last.error}` : ""}`
    : "还没有抽取记录";
  const coverage = d.turns ? Math.round((d.digests / Math.max(1, d.sessions)) * 100) : 0;
  let html = `<div class="st-wrap">
    <div class="qq-status">
      <span class="badge ${d.extract_configured ? "badge-ok" : "badge-muted"}">${d.extract_configured ? "抽取已配置" : "未配置 API key"}</span>
      <span class="row-meta">${d.digest_enabled ? "自动摘要开" : "自动摘要关"}</span>
    </div>
    ${statusState.error ? `<p class="qq-error">${esc(statusState.error)}</p>` : ""}
    <h4 class="qq-h4">抽取队列</h4>
    ${statusRow("待抽取对话", `${d.turns_pending} 条`, d.turns_pending ? "下次抽取会带上" : "已全部抽完")}
    ${statusRow("已记录对话", `${d.turns} 条 / ${d.sessions} 个会话`)}
    ${statusRow("最近一次抽取", lastText, last ? `耗时 ${last.latency_ms ?? "-"}ms · ¥${((last.cost ?? 0)).toFixed(4)}` : "")}
    <h4 class="qq-h4">记忆</h4>
    ${statusRow("事件", `${d.events} 条`)}
    ${statusRow("事实 / 特征 / 存疑", `${d.facts} / ${d.traits} / ${d.doubts}`)}
    ${statusRow("会话摘要", `${d.digests} 条`, `覆盖 ${Math.min(100, coverage)}% 的会话`)}
    <h4 class="qq-h4">运行</h4>
    ${statusRow("内核版本", d.version || "-")}
    ${statusRow("库", baseName(d.db))}
    ${statusRow("抽取模型", d.extract_model || "-")}
    <div class="qq-actions">
      <button type="button" class="btn" id="stReload">刷新</button>
      <button type="button" class="btn" id="stMaintain">立即维护</button>
    </div>
    <p class="qq-note" id="stMaintainNote"></p>
    <h4 class="qq-h4">备份</h4>
    <div class="qq-actions">
      <button type="button" class="btn" id="stBackup">立即备份</button>
      <button type="button" class="btn" id="stBackupList">刷新备份列表</button>
    </div>
    <p class="qq-note" id="stBackupNote"></p>
    <ul class="bk-list" id="stBackupItems"></ul>
    <p class="qq-note">这里显示的是真实队列：待抽取为 0 表示当前没有积压；"最近一次抽取"为 ${
      ""}<code>skipped/degraded</code> 时说明模型或预筛跳过了那个窗口，不是故障。</p>
  </div>`;
  body.innerHTML = html;
  bindStatusButtons();
}

function bindStatusButtons() {
  const btn = $("stReload");
  if (btn) btn.addEventListener("click", () => { void loadStatus(); });
  const m = $("stMaintain");
  if (m) m.addEventListener("click", () => { void runMaintain(); });
  const b = $("stBackup");
  if (b) b.addEventListener("click", () => { void runBackup(); });
  const bl = $("stBackupList");
  if (bl) bl.addEventListener("click", () => { void loadBackups(); });
}

async function runBackup() {
  const note = $("stBackupNote");
  const btn = $("stBackup");
  if (!note || !btn) return;
  btn.disabled = true;
  note.textContent = "备份中…";
  try {
    const res = await fetch(`${API}/backup`, { method: "POST" });
    const body = await res.json();
    note.textContent = body.ok
      ? `已备份：${body.name}（${Math.round(body.size / 1024)} KB，共 ${body.count} 份）`
      : `备份失败：${body.error || res.status}`;
    await loadBackups();
  } catch (err) {
    note.textContent = `备份失败：${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

async function loadBackups() {
  const list = $("stBackupItems");
  const note = $("stBackupNote");
  if (!list) return;
  try {
    const res = await fetch(`${API}/backups`);
    const body = await res.json();
    if (!body.ok) { if (note) note.textContent = `读取备份失败：${body.error || res.status}`; return; }
    if (!body.items.length) {
      list.innerHTML = '<li class="bk-empty">还没有备份</li>';
      if (note) note.textContent = `备份目录：${body.dir}`;
      return;
    }
    list.innerHTML = body.items.map((it) => {
      const when = new Date(it.mtime * 1000).toLocaleString();
      return `<li class="bk-item"><span class="bk-name" title="${esc(it.name)}">${esc(it.name)}</span>
        <span class="bk-meta">${Math.round(it.size / 1024)} KB · ${esc(when)}</span>
        <button type="button" class="btn bk-restore" data-name="${esc(it.name)}">恢复</button></li>`;
    }).join("");
    list.querySelectorAll(".bk-restore").forEach((el) => {
      el.addEventListener("click", () => { void restoreBackup(el.dataset.name || ""); });
    });
    if (note) note.textContent = `备份目录：${body.dir}`;
  } catch (err) {
    if (note) note.textContent = `读取备份失败：${err.message}`;
  }
}

async function restoreBackup(name) {
  if (!name) return;
  if (!confirm(`用备份 ${name} 覆盖当前库？
当前库会改名保留为 .pre-restore-*.bak，恢复后建议重启 DSH。`)) return;
  const note = $("stBackupNote");
  if (note) note.textContent = "恢复中…";
  try {
    const res = await fetch(`${API}/restore?name=${encodeURIComponent(name)}`, { method: "POST" });
    const body = await res.json();
    if (note) note.textContent = body.ok
      ? `已恢复。${body.hint || ""}`
      : `恢复失败：${body.error || res.status}`;
    if (body.ok) void loadStatus();
  } catch (err) {
    if (note) note.textContent = `恢复失败：${err.message}`;
  }
}

async function runMaintain() {
  const note = $("stMaintainNote");
  const btn = $("stMaintain");
  if (!note || !btn) return;
  btn.disabled = true;
  note.textContent = "维护中（重算权重 + 本地巩固）…";
  try {
    const res = await fetch(`${API}/maintain`, { method: "POST" });
    const body = await res.json();
    if (body.ok) {
      const rec = body.recompute ? `重算：${body.recompute}` : "重算：未到期，跳过";
      const con = body.consolidate && body.consolidate.length
        ? `巩固：${body.consolidate.length} 个会话` : "巩固：未到期或没有可合并项";
      note.textContent = `${rec} · ${con}`;
    } else {
      note.textContent = `维护失败：${body.error || res.status}`;
    }
    void loadStatus();
  } catch (err) {
    note.textContent = `维护失败：${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

function startStatusPoll() {
  stopStatusPoll();
  statusState.timer = setInterval(() => {
    if (state.tab === "status" && state.expanded && !state.detailId) void loadStatus();
  }, 5000);
}

function stopStatusPoll() {
  if (statusState.timer) { clearInterval(statusState.timer); statusState.timer = null; }
}

// ---------- 启动 ----------
syncRotateButton();
load();
setInterval(load, 5000);
})();
</script>
</body>
</html>
